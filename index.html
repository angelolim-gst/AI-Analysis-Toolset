<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tools</title>
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>

    <style>
        :root {
            --primary: #2C3E50;
            --accent: #3498DB;
            --bg-light: #F4F6F9;
            --text-dark: #333;
            --border: #E0E0E0;
            --success: #27AE60;
            --warning: #F39C12;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { display: flex; height: 100vh; background-color: var(--bg-light); color: var(--text-dark); }

        /* Sidebar */
        .sidebar { width: 250px; background-color: var(--primary); color: white; padding: 20px; }
        .sidebar h2 { margin-bottom: 30px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .sidebar ul { list-style: none; }
        .sidebar ul li { margin-bottom: 15px; }
        .sidebar ul li a { color: white; text-decoration: none; font-size: 1.1rem; display: block; padding: 10px; border-radius: 5px; transition: 0.3s; }
        .sidebar ul li a:hover { background-color: rgba(255,255,255,0.1); }

        /* Main Content */
        .content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        .view { display: none; }
        .view.active { display: block; }
        h1 { margin-bottom: 20px; color: var(--primary); }

        /* Cards & Forms */
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .mt-20 { margin-top: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .flex-row { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        .flex-row input { margin: 0; flex-grow: 1; }
        .flex-row button { margin: 0; white-space: nowrap; }

        label { display: block; margin: 15px 0 5px; font-weight: bold; font-size: 0.9rem; }
        input[type="text"], input[type="password"], input[type="number"], select, textarea, input[type="file"] {
            width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 5px; font-size: 1rem;
        }
        
        button { background-color: var(--accent); color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 5px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:hover { background-color: #2980B9; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .secondary-btn { background-color: #7F8C8D; }
        .secondary-btn:hover { background-color: #616A6B; }
        .success-btn { background-color: var(--success); }
        .success-btn:hover { background-color: #1E8449; }
        .warning-btn { background-color: var(--warning); color: #fff; }
        .warning-btn:hover { background-color: #D68910; }
        .small-btn { padding: 5px 10px; font-size: 0.85rem; margin-top: 5px; }

        /* Modals */
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: white; margin: 5% auto; padding: 30px; border-radius: 8px; width: 60%; box-shadow: 0 5px 15px rgba(0,0,0,0.3); max-height: 85vh; overflow-y: auto; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: black; }
        .status-msg { color: green; font-size: 0.85rem; margin-top: 5px; }

        /* Editable AI Output */
        #rca-output {
            min-height: 150px;
            padding: 15px;
            border: 2px dashed var(--accent);
            border-radius: 5px;
            background-color: #fafdff;
            outline: none;
            line-height: 1.6;
        }
        #rca-output:focus { border: 2px solid var(--accent); background-color: #fff; }
        #rca-output ul { margin-left: 20px; margin-bottom: 10px; }
        #rca-output p { margin-bottom: 10px; }
        #rca-output strong { color: var(--primary); }

        /* History Items */
        .history-item { border-bottom: 1px solid var(--border); padding: 20px 0; display: flex; justify-content: space-between; align-items: flex-start; }
        .history-item:last-child { border-bottom: none; }
        .history-details { width: 75%; }
        .history-details p { margin-bottom: 5px; }
        .rendered-history { background: #f9f9f9; padding: 10px; border-radius: 5px; font-size: 0.9rem; margin-top: 10px; border-left: 4px solid var(--accent); max-height: 200px; overflow-y: auto; }
        .history-actions { display: flex; flex-direction: column; gap: 10px; width: 20%; }
        .history-actions button { margin: 0; width: 100%; }
        .delete-btn { background-color: #E74C3C; }
        .delete-btn:hover { background-color: #C0392B; }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <h2>AI Tools</h2>
        <ul>
            <li><a href="#" onclick="showView('home')">Home (Settings)</a></li>
            <li><a href="#" onclick="showView('rca-tool')">RCA Tool</a></li>
        </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="content">
        
        <!-- HOME VIEW (Settings) -->
        <section id="home-view" class="view">
            <h1>Settings</h1>
            <div class="card">
                <label for="api-key">Gemini API Key</label>
                <div class="flex-row">
                    <input type="password" id="api-key" placeholder="Enter your API Key">
                    <button type="button" onclick="fetchModels()" class="secondary-btn">Fetch Flash Models</button>
                </div>
                
                <label for="model-version">Model Version</label>
                <select id="model-version">
                    <option value="">-- Load models using your API Key --</option>
                </select>
                
                <button onclick="saveSettings()">Save Settings</button>
            </div>
        </section>

        <!-- RCA TOOL VIEW -->
        <section id="rca-tool-view" class="view">
            <h1>RCA Tool</h1>
            <div style="display: flex; gap: 10px;">
                <button onclick="openModal('rca-settings-modal')" class="secondary-btn">Configure RCA Settings</button>
                <button onclick="openHistoryModal()" class="warning-btn">View RCA History</button>
                <button onclick="clearForm()" class="secondary-btn" style="background-color: #bdc3c7; color:#333;">Clear Form</button>
            </div>
            
            <div class="card mt-20">
                <h3>Case Details</h3>
                <p id="editing-indicator" style="display:none; color: var(--warning); font-weight: bold; margin-bottom:10px;">(Editing Past Record)</p>
                <form id="rca-form">
                    <label>Agent Name:</label> <input type="text" id="rca-agent">
                    <label>Case Number:</label> <input type="text" id="rca-case">
                    <label>Case Reason:</label> <input type="text" id="rca-reason">
                    <label>Verbatim:</label> <textarea id="rca-verbatim" rows="2"></textarea>
                    
                    <div class="grid-2">
                        <div><label>TNPS:</label> <input type="number" id="rca-tnps"></div>
                        <div><label>CSAT (1-5):</label> <input type="number" id="rca-csat" min="1" max="5"></div>
                    </div>
                    
                    <label>Further Context out of the case:</label> <textarea id="rca-context" rows="2"></textarea>
                    <label>Notes in the case (Internal):</label> <textarea id="rca-notes" rows="2"></textarea>
                    <label>Email or Chat transcript:</label> <textarea id="rca-transcript" rows="6"></textarea>
                    
                    <button type="button" id="generate-btn" onclick="generateRCA()">Generate RCA Analysis</button>
                </form>
            </div>

            <!-- Editable AI Result Section -->
            <div id="rca-result-section" class="card mt-20" style="display: none;">
                <h3>AI Analysis Result (Review & Edit)</h3>
                <p style="font-size: 0.85rem; color: gray; margin-bottom: 10px;">Click inside the text below to make manual edits before saving.</p>
                
                <div id="rca-output" contenteditable="true"></div>
                
                <button type="button" class="success-btn" onclick="saveEditedResult()">Save Final RCA to History</button>
                <button type="button" class="secondary-btn" onclick="cancelEdit()">Discard</button>
            </div>
        </section>

    </main>

    <!-- Modal for RCA Settings -->
    <div id="rca-settings-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('rca-settings-modal')">&times;</span>
            <h2>RCA Tool Settings</h2>
            
            <label>Upload Baseline CSV Document</label>
            <input type="file" id="csv-upload" accept=".csv">
            <button type="button" onclick="processCSV()" class="secondary-btn">Parse & Save CSV</button>
            <p id="csv-status" class="status-msg"></p>
            
            <label class="mt-20">System Prompt</label>
            <textarea id="system-prompt" rows="8" placeholder="Enter your instructions for Gemini here..."></textarea>
            <button type="button" onclick="resetToDefaultPrompt()" class="secondary-btn small-btn">Reset to Default Prompt</button>
            <br><br>
            
            <button onclick="saveRCASettings()">Save RCA Settings</button>
        </div>
    </div>

    <!-- Modal for RCA History -->
    <div id="history-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('history-modal')">&times;</span>
            <h2>RCA History</h2>
            <div id="history-container" style="margin-top: 20px;">
                <!-- History items injected here -->
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let currentPendingCaseData = null;
        let activeEditId = null; // Tracks if we are editing an existing history record

        const DEFAULT_PROMPT = `You are a master of Root Cause Analysis.
Use the attached CSV data as the definitive baseline for mapping criteria and identifying the 'Tertiary Driver'.
You MUST holistically evaluate all provided fields. Strictly enforce checking the 'Further Context out of the case' and 'Notes in the case (Internal)' alongside the transcript to accurately diagnose the true root cause.

Analyze the provided case details and output the RCA exactly in this format:

* **Case Number:** 
* **Case Reason:** 
* **TNPS:**
* **CSAT:**
* **Verbatim:** 
* **Most Impactful Behaviour (Tertiary Driver):** [Must exactly match an entry from the CSV]
* **Customer's Concern:** [Brief summary of the customer's issue]
* **Resolution provided by the agent:** [What the agent did]
* **Justification of selected Most Impactful Behavior:** [Explain why this specific driver from the CSV was chosen. You MUST explicitly reference how the 'Further Context' and 'Internal Notes' influenced this decision alongside the agent's actions in the transcript]

Do not include any conversational filler before or after the output list. Respond only with the requested structure.`;

        document.addEventListener("DOMContentLoaded", () => {
            showView('home');
            loadSettings();
        });

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById(`${viewId}-view`).classList.add('active');
        }

        // Modals
        function openModal(id) { document.getElementById(id).style.display = "block"; }
        function closeModal(id) { document.getElementById(id).style.display = "none"; }
        
        function openHistoryModal() {
            loadHistoryToModal();
            openModal('history-modal');
        }

        // Fetch Models
        async function fetchModels() {
            const apiKey = document.getElementById('api-key').value.trim();
            if (!apiKey) {
                alert("Please enter your API Key first.");
                return;
            }
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
                if (!response.ok) throw new Error("Failed to fetch. Check your API key and network connection.");
                
                const data = await response.json();
                const select = document.getElementById('model-version');
                select.innerHTML = ''; 

                const flashModels = data.models.filter(m => 
                    m.name.toLowerCase().includes('flash') || 
                    (m.displayName && m.displayName.toLowerCase().includes('flash'))
                );
                if (flashModels.length === 0) {
                    select.innerHTML = '<option value="">No Flash models found on this account</option>';
                    return;
                }
                flashModels.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.name; 
                    opt.text = m.displayName || m.name;
                    select.appendChild(opt);
                });
                alert("Flash models retrieved successfully!");
            } catch (err) {
                alert(err.message);
            }
        }

        // Settings
        function saveSettings() {
            const apiKey = document.getElementById('api-key').value;
            const modelSelect = document.getElementById('model-version');
            localforage.setItem('gemini-api-key', apiKey);
            if (modelSelect.selectedIndex >= 0) {
                const modelVal = modelSelect.options[modelSelect.selectedIndex].value;
                const modelText = modelSelect.options[modelSelect.selectedIndex].text;
                localforage.setItem('gemini-model', { value: modelVal, text: modelText });
            }
            alert('API Settings Saved!');
        }

        function loadSettings() {
            localforage.getItem('gemini-api-key').then(val => { if(val) document.getElementById('api-key').value = val; });
            localforage.getItem('gemini-model').then(modelObj => { 
                if(modelObj && modelObj.value) {
                    const select = document.getElementById('model-version');
                    select.innerHTML = `<option value="${modelObj.value}">${modelObj.text}</option>`;
                } 
            });
            localforage.getItem('rca-system-prompt').then(val => { 
                document.getElementById('system-prompt').value = val ? val : DEFAULT_PROMPT;
            });
        }

        function resetToDefaultPrompt() {
            document.getElementById('system-prompt').value = DEFAULT_PROMPT;
        }

        // CSV Parsing
        function processCSV() {
            const fileInput = document.getElementById('csv-upload');
            const statusMsg = document.getElementById('csv-status');
            if (!fileInput.files.length) {
                statusMsg.style.color = 'red';
                statusMsg.innerText = "Please select a file first.";
                return;
            }
            Papa.parse(fileInput.files[0], {
                header: true, skipEmptyLines: true,
                complete: function(results) {
                    localforage.setItem('rca-csv-data', results.data).then(() => {
                        statusMsg.style.color = 'green';
                        statusMsg.innerText = "CSV successfully parsed and saved to local storage!";
                    });
                }
            });
        }

        function saveRCASettings() {
            localforage.setItem('rca-system-prompt', document.getElementById('system-prompt').value).then(() => {
                alert('RCA Settings Saved!');
                closeModal('rca-settings-modal');
            });
        }

        // Clear Form & Reset State
        function clearForm() {
            document.getElementById('rca-form').reset();
            document.getElementById('rca-result-section').style.display = 'none';
            document.getElementById('editing-indicator').style.display = 'none';
            activeEditId = null;
            currentPendingCaseData = null;
        }

        // Get Input Data Helper
        function getFormData() {
            return {
                agent: document.getElementById('rca-agent').value,
                caseNumber: document.getElementById('rca-case').value,
                reason: document.getElementById('rca-reason').value,
                verbatim: document.getElementById('rca-verbatim').value,
                tnps: document.getElementById('rca-tnps').value,
                csat: document.getElementById('rca-csat').value,
                context: document.getElementById('rca-context').value,
                notes: document.getElementById('rca-notes').value,
                transcript: document.getElementById('rca-transcript').value
            };
        }

        // Generate RCA
        async function generateRCA() {
            const apiKey = await localforage.getItem('gemini-api-key');
            const modelObj = await localforage.getItem('gemini-model');
            const csvData = await localforage.getItem('rca-csv-data');
            const systemPrompt = await localforage.getItem('rca-system-prompt');

            if (!apiKey || !modelObj || !modelObj.value) {
                alert("Please set your Gemini API key and select a model in the Home view first.");
                showView('home');
                return;
            }
            if (!csvData) {
                alert("Please upload and parse your baseline CSV in the RCA Settings.");
                return;
            }

            const btn = document.getElementById('generate-btn');
            btn.disabled = true;
            btn.innerText = "Analyzing with Gemini...";

            const inputs = getFormData();
            
            // Build the full prompt
            const combinedPrompt = `
${systemPrompt ? "System Instructions:\n" + systemPrompt + "\n\n" : ""}
Baseline CSV Data (RCA Drivers):
${JSON.stringify(csvData)}

Please perform a Root Cause Analysis for the following case based on the drivers above:
Agent Name: ${inputs.agent}
Case Number: ${inputs.caseNumber}
Case Reason: ${inputs.reason}
Verbatim: ${inputs.verbatim}
TNPS: ${inputs.tnps}
CSAT: ${inputs.csat}
Further Context: ${inputs.context}
Internal Notes: ${inputs.notes}
Transcript: 
${inputs.transcript}
            `;

            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/${modelObj.value}:generateContent?key=${apiKey}`;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: combinedPrompt }] }] })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "Failed to generate content.");
                }

                const data = await response.json();
                let aiResult = (data.candidates && data.candidates[0]?.content) ? 
                                data.candidates[0].content.parts[0].text : 
                                "Error: Unexpected response format from API.";

                // Render in UI
                const outputDiv = document.getElementById('rca-output');
                outputDiv.innerHTML = marked.parse(aiResult);
                document.getElementById('rca-result-section').style.display = 'block';
                outputDiv.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                alert("API Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Generate RCA Analysis";
            }
        }

        // Save Edited/Generated Result
        function saveEditedResult() {
            const inputs = getFormData();
            const finalHtmlContent = document.getElementById('rca-output').innerHTML;
            
            // Create or update record object
            const recordToSave = {
                id: activeEditId ? activeEditId : Date.now().toString(),
                date: new Date().toLocaleString(),
                inputs: inputs,
                finalAnalysisHTML: finalHtmlContent
            };

            localforage.getItem('rca-history').then(history => {
                let historyArr = history || [];
                
                if (activeEditId) {
                    // Update existing
                    const index = historyArr.findIndex(h => h.id === activeEditId);
                    if (index > -1) historyArr[index] = recordToSave;
                    else historyArr.unshift(recordToSave);
                } else {
                    // Add new
                    historyArr.unshift(recordToSave);
                }
                
                localforage.setItem('rca-history', historyArr).then(() => {
                    alert('Final RCA Saved to History!');
                    clearForm();
                });
            });
        }

        function cancelEdit() {
            document.getElementById('rca-result-section').style.display = 'none';
        }

        // --- History Modal Logic ---
        function loadHistoryToModal() {
            const container = document.getElementById('history-container');
            container.innerHTML = '';

            localforage.getItem('rca-history').then(history => {
                if (!history || history.length === 0) {
                    container.innerHTML = '<p>No history found.</p>';
                    return;
                }

                history.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = `
                        <div class="history-details">
                            <strong>Case: ${item.inputs.caseNumber || 'N/A'}</strong> - ${item.inputs.agent || 'N/A'}
                            <p style="font-size: 0.85em; color: gray;">${item.date}</p>
                            <p><em>Reason:</em> ${item.inputs.reason || 'N/A'}</p>
                            <div class="rendered-history">
                                ${item.finalAnalysisHTML}
                            </div>
                        </div>
                        <div class="history-actions">
                            <button class="secondary-btn" onclick="loadToTool('${item.id}')">Load & Edit</button>
                            <button class="delete-btn" onclick="deleteHistoryItem('${item.id}')">Delete</button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            });
        }

        function loadToTool(id) {
            localforage.getItem('rca-history').then(history => {
                const item = history.find(h => h.id === id);
                if (item) {
                    // Populate Form
                    document.getElementById('rca-agent').value = item.inputs.agent || '';
                    document.getElementById('rca-case').value = item.inputs.caseNumber || '';
                    document.getElementById('rca-reason').value = item.inputs.reason || '';
                    document.getElementById('rca-verbatim').value = item.inputs.verbatim || '';
                    document.getElementById('rca-tnps').value = item.inputs.tnps || '';
                    document.getElementById('rca-csat').value = item.inputs.csat || '';
                    document.getElementById('rca-context').value = item.inputs.context || '';
                    document.getElementById('rca-notes').value = item.inputs.notes || '';
                    document.getElementById('rca-transcript').value = item.inputs.transcript || '';

                    // Show AI output
                    document.getElementById('rca-output').innerHTML = item.finalAnalysisHTML || '';
                    document.getElementById('rca-result-section').style.display = 'block';

                    // Update State
                    activeEditId = item.id;
                    document.getElementById('editing-indicator').style.display = 'block';

                    closeModal('history-modal');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });
        }

        function deleteHistoryItem(id) {
            if(!confirm("Are you sure you want to delete this entry?")) return;
            localforage.getItem('rca-history').then(history => {
                const newHistory = history.filter(item => item.id !== id);
                localforage.setItem('rca-history', newHistory).then(() => {
                    if (activeEditId === id) clearForm(); // If deleting what's currently loaded
                    loadHistoryToModal();
                });
            });
        }
    </script>
</body>
</html>
